async function acceptFj(id){

async function upIcon(el){

    const blob=await new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const k=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle='#0B0B0C';x.fillRect(0,0,512,512);x.drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,512,512);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Could not read that image.')),'image/png')};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Could not read that image. Try a JPG or PNG.'))};img.src=u});

    const url=sb.storage.from('covers').getPublicUrl(path).data.publicUrl,r=await sb.from('app_content').upsert({key:'app_icon',data:{url},updated_at:new Date().toISOString()});

  }catch(e){m.textContent='Upload failed: '+String((e&&e.message)||e)}
  el.value='';
}

const BKT=['event_gear','event_selection','weddings','photo_groups','timeline_items','must_haves','wedding_party','wedding_locations','wedding_notes','event_billing','payments','event_costs','event_crew','crew','event_delivery','event_timer','event_agreement','bookings','enquiries','freelance_clients','freelance_jobs','reviews','app_content'];
async function doBackup(){
  toast('Preparing your backup…');
  const out={app:'Zema Planner',made:new Date().toISOString(),tables:{},missing:[]};
  for(const t of BKT){
    let rows=[],from=0,ok=true;
    for(;;){const{data,error}=await sb.from(t).select('*').range(from,from+999);if(error){ok=false;break}rows=rows.concat(data||[]);if(!data||data.length<1000)break;from+=1000}
    if(ok)out.tables[t]=rows;else out.missing.push(t);
  }
  const n=Object.values(out.tables).reduce((a,r)=>a+r.length,0),blob=new Blob([JSON.stringify(out)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download='zema-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
  try{localStorage.setItem('zemaLastBackup',today())}catch(_){}
  toast('Backup saved: '+n+' records'+(out.missing.length?'. Not included: '+out.missing.join(', '):'')+'.');
}
