/* Copy whatever is typed in the editor back into pk before any re-render or save */
function collectPk(){
  document.querySelectorAll('[data-f]').forEach(el=>{
    const path=el.dataset.f.split('.');let o=pk;
    for(let i=0;i<path.length-1;i++){o=o&&o[path[i]]}
    if(o)o[path[path.length-1]]=el.dataset.list?el.value.split('\n').map(x=>x.trim()).filter(Boolean):el.value.trim();
  });
}
async function savePk(){
  collectPk();
  const{error}=await sb.from('app_content').upsert({key:'packages',data:pk,updated_at:new Date().toISOString()});
  if(error){toast(/relation|schema|find the table/i.test(error.message)?'Run the packages SQL in Supabase first, then refresh.':'Could not save: '+error.message);render();return false}
  pkErr=false;PKG=pk.wed.map(x=>x.n).filter(Boolean);render();toast('Packages saved');return true;
}

/* ---- Live updates: the photographer sends a tiny "refresh" signal, family pages refetch ---- */
function notifyFamily(){
  if(TOKEN||FTOKEN||!wed||!wed.family_token)return;
  const n='fam-'+wed.family_token;
  let c=chans[n];
  if(!c){c=chans[n]=sb.channel(n);c.subscribe()}
  try{c.send({type:'broadcast',event:'upd',payload:{t:Date.now()}})}catch(_){}
}
function watchFamily(){
  const ch=sb.channel('fam-'+FTOKEN);
  ch.on('broadcast',{event:'upd'},()=>loadFamily()).subscribe(st=>{
    ui.live=(st==='SUBSCRIBED');
    if(st==='SUBSCRIBED')loadFamily();else if(wed)render();
  });
}

async function init(){
  if(PKPAGE)document.title='Zema Production · Packages';
  if(!window.supabase)await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
  if(!window.supabase)return setApp(PKPAGE?pkgView(pkNorm(null)):'<p class="empty">Could not load the Supabase library. Check your internet connection and refresh.</p>');
  sb=supabase.createClient(SB_URL,SB_KEY,(TOKEN||FTOKEN||PKPAGE)?{auth:{persistSession:false,autoRefreshToken:false}}:undefined);
  if(PKPAGE){const r=await loadPk();return setApp(pkgView(r.d))}
  if(FTOKEN){loadFamily();watchFamily();setInterval(()=>{if(!document.hidden)loadFamily()},30000);return}
  if(TOKEN)return loadShared();
  const{data}=await sb.auth.getSession();user=data.session?data.session.user:null;
  sb.auth.onAuthStateChange((_e,s)=>{const u=s?s.user:null;if((u&&u.id)!==(user&&user.id)){user=u;wed=null;ui.view='dash';boot()}});
  boot();
}

  else if(a==='editW')openWForm(wed.id);
  else if(a==='saveW')saveW();
  else if(a==='delW')ask('Delete this event and everything in it? This cannot be undone.',async()=>{const{error}=await sb.from('weddings').delete().eq('id',ui.modal&&ui.modal.id||wed.id);if(error)return toast('Could not delete: '+error.message);loadDash()});
  else if(a==='openW')openWedding(id);
  else if(a==='back'){if(ui.view==='pkgs')pk=null;loadDash()}
  else if(a==='copyW')copyLink(weds.find(x=>x.id===id).share_token);
  else if(a==='copyFW')copyLink(weds.find(x=>x.id===id).family_token,'f');
  else if(a==='copy')copyLink(wed.share_token);
  else if(a==='copyF')copyLink(wed.family_token,'f');
  else if(a==='copyP')copyLink('1','p');
  else if(a==='editPk'&&!TOKEN&&pk){ui.view='pkgs';render();scrollTo(0,0)}
  else if(a==='savePk'&&!TOKEN)savePk();
  else if(a==='togHide'&&!TOKEN){collectPk();pk.hide=!pk.hide;if(!await savePk()){pk.hide=!pk.hide;render()}}
  else if(a==='viewPk')window.open(location.origin+location.pathname+'?p=1','_blank');
  else if(a==='pkAdd'&&!TOKEN){collectPk();pk[t.dataset.g==='ev'?'ev':'wed'].push(t.dataset.g==='ev'?{n:'New package',p:'',d:''}:{n:'New package',p:'',d:'',f:[]});render()}
  else if((a==='pkUp'||a==='pkDown')&&!TOKEN){collectPk();const l=pk[t.dataset.g==='ev'?'ev':'wed'],i=+t.dataset.i,j=i+(a==='pkUp'?-1:1);if(l[j]){[l[i],l[j]]=[l[j],l[i]];render()}}
  else if(a==='pkDel'&&!TOKEN){collectPk();const l=pk[t.dataset.g==='ev'?'ev':'wed'],i=+t.dataset.i;ask(`Remove “${l[i].n||'this package'}”? It disappears from the page when you save.`,()=>{l.splice(i,1);render()})}
  else if(a==='approve'&&TOKEN)openApprove();
  else if(a==='doApprove'&&TOKEN)doApprove();
  else if(a==='reopen'&&!TOKEN)ask('Reopen this plan so the couple can edit it again?',async()=>{const{error}=await sb.from('weddings').update({approval_status:'draft',approved_at:null,approved_by:null}).eq('id',wed.id);if(error)return toast('Could not reopen: '+error.message);Object.assign(wed,{approval_status:'draft',approved_at:null,approved_by:null});render()});
  else if(a==='tab'){ui.tab=t.dataset.k;render()}
  else if(a==='sec'){ui.sec=t.dataset.k;render()}
  else if(a==='tog'&&!TOKEN){g.done=!g.done;render();run(sb.from('photo_groups').update({done:g.done}).eq('id',id))}
  else if(a==='togT'&&!TOKEN&&ti){ti.done=!ti.done;render();run(sb.from('timeline_items').update({done:ti.done}).eq('id',id))}
  else if(a==='up'||a==='down')move(id,a==='up'?-1:1);
  else if(a==='edit')openForm(id);
  else if(a==='add')openForm();
  else if(a==='del')ask(`Delete “${g.name}”?`,()=>{wed.groups=G().filter(x=>x.id!==id);render();run(TOKEN?sb.rpc('shared_delete_group',{p_token:TOKEN,p_id:id}):sb.from('photo_groups').delete().eq('id',id))});
  else if(a==='addT')openTForm();
  else if(a==='editT')openTForm(id);
  else if(a==='saveT')saveT();
  else if(a==='delT'&&ti)ask(`Delete “${ti.title}”?`,()=>{wed.timeline=T().filter(x=>x.id!==id);render();run(TOKEN?sb.rpc('shared_timeline_delete',{p_token:TOKEN,p_id:id}):sb.from('timeline_items').delete().eq('id',id))});
  else if(a==='addM')openMForm();
  else if(a==='editM')openMForm(id);
  else if(a==='saveM')saveM();
  else if(a==='togM'&&!TOKEN&&mi){mi.done=!mi.done;render();run(sb.from('must_haves').update({done:mi.done}).eq('id',id))}
  else if(a==='delM'&&mi)ask(`Delete “${mi.title}”?`,()=>{wed.musts=M().filter(x=>x.id!==id);render();run(TOKEN?sb.rpc('shared_musts_delete',{p_token:TOKEN,p_id:id}):sb.from('must_haves').delete().eq('id',id))});
  else if(a==='addPt')openPForm();
  else if(a==='editPt')openPForm(id);
  else if(a==='savePt')savePt();
  else if(a==='delPt'&&pi)ask(`Remove “${pi.name}”?`,()=>{wed.party=P().filter(x=>x.id!==id);render();run(TOKEN?sb.rpc('shared_party_delete',{p_token:TOKEN,p_id:id}):sb.from('wedding_party').delete().eq('id',id))});
  else if(a==='addL')openLForm();
  else if(a==='editL')openLForm(id);
  else if(a==='saveL')saveL();
  else if(a==='delL'&&li)ask(`Delete “${li.name}”?`,()=>{wed.places=L().filter(x=>x.id!==id);render();run(TOKEN?sb.rpc('shared_places_delete',{p_token:TOKEN,p_id:id}):sb.from('wedding_locations').delete().eq('id',id))});
  else if(a==='editN')openNForm(TOKEN?'client':t.dataset.k);
  else if(a==='saveN')saveN();
  else if(a==='setStage'&&!TOKEN&&STG[t.dataset.k])setW({stage:t.dataset.k});
  else if(a==='setPkg'&&!TOKEN)setW({package:wed.package===t.dataset.k?'':t.dataset.k});
  else if(a==='setAlbum'&&!TOKEN&&ALB[t.dataset.k])setW({album_status:t.dataset.k});
  else if(a==='prog'&&!TOKEN){const k=t.dataset.k==='video'?'video_progress':'photo_progress';setW({[k]:Math.max(0,Math.min(100,(wed[k]||0)+(+t.dataset.d)))})}
  else if(a==='togW'&&!TOKEN&&['photos_delivered','film_delivered','share_progress'].includes(t.dataset.k))setW({[t.dataset.k]:!wed[t.dataset.k]});
  else if(a==='day'&&!TOKEN){ui.day=true;render();scrollTo(0,0);try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(_){}}
  else if(a==='exit'){ui.day=false;render()}
  else if(a==='close')closeM();
  else if(a==='save')saveForm();
  else if(a==='addp')addP();
  else if(a==='rmp'){ui.modal.people.splice(+t.dataset.i,1);chips()}
  else if(a==='yes'){const f=ui.modal.fn;closeM();f()}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='fp'&&(e.key==='Enter'||e.key===',')){e.preventDefault();addP()}
  if(e.target.id==='pw'&&e.key==='Enter')login();
  if(e.key==='Escape'&&ui.modal)closeM();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!ui.modal&&!PKPAGE&&ui.view!=='pkgs'&&((TOKEN||FTOKEN)?wed:user))reload()});
init();
</script></body></html>
