          SPLASH = [(750, 1334, 2), (1242, 2208, 3), (1125, 2436, 3), (828, 1792, 2), (1242, 2688, 3), (1170, 2532, 3), (1284, 2778, 3), (1179, 2556, 3), (1290, 2796, 3), (1206, 2622, 3), (1320, 2868, 3), (1260, 2736, 3)]
          BG = bytes((11, 11, 12))

          def chunk(tag, data):
              return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)

          def splash(path, w, h, scale):
              size, packed = LOGOS[scale]
              logo = zlib.decompress(base64.b64decode(packed))
              x0, y0 = (w - size) // 2, (h - size) // 2
              blank = b'\x00' + BG * w
              rows = []
              for y in range(h):
                  if y0 <= y < y0 + size:
                      i = (y - y0) * size * 3
                      rows.append(b'\x00' + BG * x0 + logo[i:i + size * 3] + BG * (w - x0 - size))
                  else:
                      rows.append(blank)
              body = zlib.compress(b''.join(rows), 9)
              with open(path, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', body) + chunk(b'IEND', b''))

          for name, data in FILES.items():
              with open(os.path.join(ROOT, name), 'wb') as f:
                  f.write(base64.b64decode(data))
              print('wrote', name)

          os.makedirs(os.path.join(ROOT, 'zema-splash'), exist_ok=True)
          for w, h, scale in SPLASH:
              splash(os.path.join(ROOT, 'zema-splash', '%dx%d.png' % (w, h)), w, h, scale)
              print('wrote splash', w, h)
          PYEOF
      - name: Save them to the repository
        run: |
          git config user.name "Zema app files"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to change."
          else
            git commit -m "Add Zema Planner app files"
            git pull --rebase
            git push
          fi
