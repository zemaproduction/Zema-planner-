name: Zema app files

# Writes the files that make Zema Planner an installable iPhone app:
# the app manifest, the service worker, the app icons and the start-up screens.
# It runs once when this file is added, and again whenever you press "Run workflow".

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/zema-app.yml'

permissions:
  contents: write

jobs:
  write-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the app files
